[package]
name = "dedupe"
version = "0.1.0"
edition = "2021"
description = "Dedupelifier — duplicate finder with a designed terminal experience"
license = "MIT"
default-run = "dedupe"

[[bin]]
name = "dedupe"
path = "src/main.rs"

[lib]
name = "dedupe"
path = "src/lib.rs"

[dependencies]
blake3 = { version = "1.8", features = ["rayon"] }
rayon = "1.12"
walkdir = "2.5"
same-file = "1.0"
trash = "5.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "7.0"
crossterm = "0.29"
unicode-width = "0.2"
ctrlc = "3.4"
time = { version = "0.3", default-features = false, features = ["local-offset"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico"] }
kamadak-exif = "0.6"
sha2 = "0.10"
tract-onnx = { version = "0.23", optional = true }

[target.'cfg(windows)'.dependencies]
# the volume a path lives on (doctor: is `_milked` on another drive)
winapi-util = "0.1"
# the Recycle Bin through the shell's file operation, a progress sink
# refusing what the bin cannot hold (src/recycle.rs); the versions the
# `trash` crate already builds
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
windows-core = "0.62"

[features]
# The deep tier (SSCD embeddings through tract). On by default so one
# binary serves everyone; `--no-default-features` builds a 3 MB binary
# without it. Nothing runs unless a model file is installed either way.
default = ["deep"]
deep = ["dep:tract-onnx"]

[dev-dependencies]
tempfile = "3"
walkdir = "2.5"
# the reduced JPEG route measured in tests/decode_reduced.rs (TECH-02, not shipped)
jpeg-decoder = { version = "0.3.2", default-features = false }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# CI (.github/workflows/ci.yml): release speed for the tests' image work,
# without the link-time optimisation that makes every test binary slow to
# build
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
strip = false
