# The suite on Linux and Windows, with ffmpeg, on every push to main and
# every pull request (Phase 12, TECH-08): Windows no longer waits for a
# manual run. The `ci` profile is release without LTO, so the test
# binaries build in minutes and the image work runs at release speed.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

jobs:
  suite:
    name: suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Rust (stable, with clippy and rustfmt)
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | sed -n 1p

      # Chocolatey's bin folder is one `dedupe` looks in when PATH does not
      # name ffmpeg; on the runner it is on PATH as well
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg -y --no-progress
          ffmpeg -version

      - name: format
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets --profile ci -- -D warnings

      - name: clippy without the deep tier
        run: cargo clippy --all-targets --no-default-features --profile ci -- -D warnings

      - name: tests
        run: cargo test --profile ci

      - name: tests without the deep tier
        run: cargo test --profile ci --no-default-features --lib --test e2e

      # the end-to-end tests that need a console: Ctrl-C to a milk, the
      # workspace driven through a pseudo console, colour on it; their own
      # words say whether they ran or skipped
      - name: Ctrl-C, the workspace and colour, shown
        run: cargo test --profile ci --test e2e -- --nocapture interrupted_milk_leaves_a_journal_undo_can_use find_on_a_terminal_acts_from_the_result a_terminal_gets_colour

      # the Recycle Bin refusing a file too large for it: the test caps the
      # temp volume's bin at 1 MB and puts it back; only on a runner, which
      # is thrown away after the job (Phase 13, TECH-11)
      - name: the Recycle Bin refusing a file
        if: runner.os == 'Windows'
        env:
          DEDUPE_TEST_BIN_CAP: "1"
        run: cargo test --profile ci --test e2e -- --ignored --nocapture the_bin_refusing_a_file_leaves_it_on_disk

      - name: doctor
        run: cargo run --profile ci -- --doctor
