# The release binaries, Windows x64 (MSVC, as on the owner's machine) and
# Linux x64, each with its SHA-256. A push to main whose commit message
# carries `[release]` builds them as the run's artifacts (kept 30 days);
# a tag `vX.Y.Z` matching Cargo.toml builds them and publishes them as
# that version's GitHub release. `dedupe --version` in them names the
# commit built.
name: release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust (stable)
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: the tag is the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, Cargo.toml $v"; exit 1; }

      - name: build
        run: cargo build --release --locked

      - name: package
        shell: bash
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="dedupe-v$v-${{ matrix.target }}"
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./target/release/dedupe.exe --version
            7z a -tzip "dist/$name.zip" ./target/release/dedupe.exe > /dev/null
            (cd dist && sha256sum "$name.zip" > "$name.zip.sha256")
          else
            ./target/release/dedupe --version
            tar -czf "dist/$name.tar.gz" -C target/release dedupe
            (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "dedupe ${GITHUB_REF_NAME#v}" \
            --notes "Built from ${GITHUB_SHA::7} by the release workflow: Windows x64 (MSVC) and Linux x64. What is in it: docs/PLAN.md, its phases marked delivered; the output as it is drawn: docs/CLI.md."
